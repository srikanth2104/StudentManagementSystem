<!DOCTYPE html>
<html>

<head>

    <meta charset="UTF-8">

    <title>Student Registration</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <div class="container">

        <h1>Student Registration</h1>

        <form action="register" method="post">

            <label>Student ID</label>

            <input
                type="number"
                name="sid"
                required
            >

            <label>Student Name</label>

            <input
                type="text"
                name="sname"
                required
            >

            <label>Student Address</label>

            <input
                type="text"
                name="saddr"
                required
            >

            <label>Phone Number</label>

            <input
                type="tel"
                name="sphone"
                required
            >

            <button type="submit">
                Register Student
            </button>

        </form>

        <br>

        <a href="index.html">
            Back to Home
        </a>

    </div>

</body>

</html>
